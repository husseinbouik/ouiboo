name: Auto-fix

# Automatically fixes lint/format issues and pushes the fix back to the PR branch.
# This prevents the common loop of "CI fails lint -> manually fix -> push -> wait".
# Only touches files changed in the PR to avoid reformatting the entire repo.
on:
  pull_request:
    branches: [ master, staging ]
    types: [ opened, synchronize, reopened ]

permissions:
  contents: write
  pull-requests: write
  workflows: write

jobs:
  autofix:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Only run on PRs from this repo (not forks, where the token can't push)
    if: github.event.pull_request.head.repo.full_name == github.repository
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci --include=dev

      - name: Get changed files
        id: changed
        run: |
          FILES=$(git diff --name-only origin/${{ github.base_ref }}...HEAD -- '*.ts' '*.tsx' '*.js' '*.jsx' '*.json' '*.md' '*.yml' '*.yaml' | tr '\n' ' ')
          echo "files=$FILES" >> $GITHUB_OUTPUT
          echo "Changed files: $FILES"

      - name: Run prettier on changed files
        if: steps.changed.outputs.files != ''
        run: npx prettier --write ${{ steps.changed.outputs.files }} || true

      - name: Run eslint --fix on changed files
        if: steps.changed.outputs.files != ''
        run: npx eslint --fix ${{ steps.changed.outputs.files }} || true

      - name: Commit fixes if any
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "fix(ci): auto-fix lint and formatting issues"
            git push
            echo "Pushed auto-fixes to ${{ github.head_ref }}"
          else
            echo "No auto-fixable issues found"
          fi
