name: Auto-fix

# Automatically fixes lint/format issues and pushes the fix back to the PR branch.
# This prevents the common loop of "CI fails lint -> manually fix -> push -> wait".
on:
  pull_request:
    branches: [ master, staging ]
    types: [ opened, synchronize, reopened ]

permissions:
  contents: write
  pull-requests: write

jobs:
  autofix:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Only run on PRs from this repo (not forks, where the token can't push)
    if: github.event.pull_request.head.repo.full_name == github.repository
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci --include=dev

      - name: Run lint --fix
        run: npx turbo lint -- --fix 2>/dev/null || npm run lint -- --fix 2>/dev/null || true

      - name: Run prettier --write
        run: npx prettier --write . 2>/dev/null || true

      - name: Commit fixes if any
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "fix(ci): auto-fix lint and formatting issues"
            git push
            echo "Pushed auto-fixes to ${{ github.head_ref }}"
          else
            echo "No auto-fixable issues found"
          fi
