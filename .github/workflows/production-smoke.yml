name: Staging Smoke Tests

# Runs fast production smoke tests on every PR to staging.
# Catches broken URLs, CORS regressions, dead links, and UI failures
# before they reach production. Failures auto-create GitHub issues.
#
# The smoke job is merge-blocking on PRs: branch protection requires the
# `smoke` context, and the test step does not swallow failures, so a real
# smoke failure fails the job (issue #245). Scheduled/manual runs fail
# loudly the same way and still file issues via the failure() step below.
# Release gating itself remains the human blocking smoke in
# docs/launch-ops/RELEASE_RUNBOOK.md; this workflow never gates a release.

on:
  pull_request:
    branches: [staging, master]
  workflow_dispatch:
  schedule:
    # Daily at 06:00 UTC as a safety net
    - cron: '0 6 * * *'

concurrency:
  group: production-smoke-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  issues: write

jobs:
  smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Path filtering at step level (#1021): these tests exercise the
      # LIVE staging deployments, not the PR's code, so a docs-only PR
      # gains nothing from a run. The job still always runs and reports
      # the `smoke` context — deliberately, so that re-adding `smoke`
      # to branch protection (planned 2026-12-24) can never deadlock a
      # docs-only PR on a suppressed context. Scheduled and manual runs
      # always execute the full suite.
      - name: Detect change areas
        id: changes
        uses: ./.github/actions/detect-changes
        with:
          base-sha: ${{ github.event.pull_request.base.sha || github.event.before }}

      - name: Note skipped smoke run
        if: github.event_name == 'pull_request' && steps.changes.outputs.code != 'true'
        run: echo "Docs-only PR — live smoke suite skipped (#1021). The smoke context still reports success from this job."

      - name: Set up Node.js
        if: github.event_name != 'pull_request' || steps.changes.outputs.code == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        if: github.event_name != 'pull_request' || steps.changes.outputs.code == 'true'
        run: npm ci --include=dev
        working-directory: .

      - name: Cache Playwright browsers
        if: github.event_name != 'pull_request' || steps.changes.outputs.code == 'true'
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-playwright-

      - name: Install Playwright browsers
        if: github.event_name != 'pull_request' || steps.changes.outputs.code == 'true'
        run: npx playwright install --with-deps chromium

      - name: Run production smoke tests
        if: github.event_name != 'pull_request' || steps.changes.outputs.code == 'true'
        id: smoke
        run: mkdir -p test-results && npx playwright test --config playwright.smoke.config.ts
        env:
          SMOKE_TRAVELER_URL: ${{ vars.STAGING_TRAVELER_URL }}
          SMOKE_AGENCY_URL: ${{ vars.STAGING_AGENCY_URL }}
          SMOKE_ADMIN_URL: ${{ vars.STAGING_ADMIN_URL }}
          SMOKE_LANDING_URL: ${{ vars.STAGING_LANDING_URL }}
          SMOKE_API_URL: ${{ vars.STAGING_API_URL }}

      # failure() is required here: now that the test step fails the job,
      # a plain outcome check would be skipped by the implicit success().
      - name: Parse failures and create issues
        if: failure() && steps.smoke.outcome == 'failure'
        uses: actions/github-script@v9
        with:
          script: |
            const fs = require('fs');

            let report;
            try {
              const files = fs.readdirSync('test-results');
              const jsonFile = files.find(f => f.endsWith('.json'));
              report = JSON.parse(fs.readFileSync(`test-results/${jsonFile}`, 'utf8'));
            } catch (e) {
              console.log('Could not read test report:', e.message);
              return;
            }

            const failures = [];
            const collectFailures = (suite) => {
              for (const spec of (suite.specs || [])) {
                for (const test of (spec.tests || [])) {
                  const failed = (test.results || []).some(r => r.status === 'failed' || r.status === 'timedOut');
                  if (failed) {
                    const error = (test.results || [])
                      .flatMap(r => (r.errors || []).map(e => e.message))
                      .join('\n').slice(0, 2000);
                    failures.push({ title: spec.title, error });
                  }
                }
              }
              for (const child of (suite.suites || [])) collectFailures(child);
            };
            for (const suite of (report.suites || [])) collectFailures(suite);

            if (failures.length === 0) {
              console.log('No failures found in report');
              return;
            }

            const { data: existing } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'smoke-test',
              per_page: 50,
            });
            const existingTitles = new Set(existing.map(i => i.title));

            for (const f of failures) {
              const title = `[smoke] ${f.title}`;
              if (existingTitles.has(title)) {
                console.log(`Skipping duplicate: ${title}`);
                continue;
              }
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title,
                body: [
                  '## Automated Smoke Test Failure',
                  '',
                  `**Test:** ${f.title}`,
                  `**PR:** #${context.payload.pull_request?.number || 'scheduled'}`,
                  `**Commit:** ${context.sha.slice(0, 8)}`,
                  `**Run:** ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
                  '',
                  '### Error',
                  '```',
                  f.error || '(no error details captured)',
                  '```',
                  '',
                  '_Auto-created by production smoke tests. Close if fixed or flaky._',
                ].join('\n'),
                labels: ['bug', 'smoke-test', 'automated'],
              });
              console.log(`Created issue: ${title}`);
            }
