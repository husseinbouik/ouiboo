name: Browser E2E

on:
  pull_request:
    branches: [ master, staging ]
  push:
    branches: [ master, staging ]

permissions:
  contents: read

jobs:
  browser-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      NEXT_PUBLIC_API_URL: http://127.0.0.1:3000/api
      NEXT_PUBLIC_MEDIA_URL: http://127.0.0.1:3000/api/v1/media
      # Test-only session signing secret. The #208 proxy auth gate verifies the
      # ouiboo_session cookie with HMAC-SHA256(SESSION_SECRET); e2e tests sign
      # their own cookies via e2e/helpers.ts authenticateAs(). Never use a real secret here.
      SESSION_SECRET: e2e-test-secret

    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browser
        run: npm run test:e2e:install

      - name: Build Next.js apps
        # Build separately so failures are visible; the webServer entries only serve.
        run: |
          npm run build --workspace apps/traveler
          npm run build --workspace apps/agency
          npm run build --workspace apps/admin

      - name: Run browser launch suite
        # Local mock-backed projects only. The production-smoke project
        # targets LIVE deployments (SMOKE_* URLs, canonical prod domains
        # by default in the spec) — in this PR gate it would test the
        # previously released production build, not this PR, and it
        # failed deterministically on surfaces the staging fixes had
        # already landed for (localhost metadataBase, #418, anonymous
        # 401s) because production still served the older master build.
        # It keeps its own gate: production-smoke.yml runs the spec
        # explicitly against the staging deployments on every PR.
        run: npm run test:e2e -- --project=traveler --project=traveler-mobile --project=agency --project=admin

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report
          if-no-files-found: ignore
