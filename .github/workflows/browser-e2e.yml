name: Browser E2E

on:
  pull_request:
    branches: [ master, staging ]
  push:
    branches: [ master, staging ]

permissions:
  contents: read

jobs:
  browser-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      NEXT_PUBLIC_API_URL: http://127.0.0.1:3000/api
      NEXT_PUBLIC_MEDIA_URL: http://127.0.0.1:3000/api/v1/media

    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browser
        run: npm run test:e2e:install

      - name: Build Next.js apps (standalone)
        # Build separately so failures are visible; the webServer entries only serve.
        run: |
          npm run build --workspace apps/traveler
          npm run build --workspace apps/agency
          npm run build --workspace apps/admin

      - name: Run browser launch suite
        run: npm run test:e2e

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report
          if-no-files-found: ignore
