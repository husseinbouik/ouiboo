name: Cache Cleanup

# Prevent the 10GB GitHub Actions cache limit from being hit again.
# Runs weekly, deletes caches not accessed in 7 days.
on:
  schedule:
    - cron: "0 4 * * 0"  # Sunday 04:00 UTC
  workflow_dispatch:

permissions:
  actions: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Delete stale caches
        uses: actions/github-script@v9
        with:
          script: |
            const cutoff = Date.now() - 7 * 24 * 60 * 60 * 1000;
            let deleted = 0, kept = 0, bytes = 0;
            for await (const { data: { actions_caches } } of github.paginate.iterator(
              github.rest.actions.getActionsCacheList,
              { owner: context.repo.owner, repo: context.repo.repo, per_page: 100 }
            )) {
              for (const cache of actions_caches) {
                if (new Date(cache.last_accessed_at).getTime() < cutoff) {
                  await github.rest.actions.deleteActionsCacheByKey({
                    owner: context.repo.owner, repo: context.repo.repo, key: cache.key,
                  }).catch(() => {});
                  deleted++;
                  bytes += cache.size_in_bytes;
                } else {
                  kept++;
                }
              }
            }
            core.summary
              .addHeading("Cache cleanup")
              .addRaw(`Deleted ${deleted} stale caches (${(bytes / 1e9).toFixed(2)} GB), kept ${kept}.`)
              .write();
