name: PR Hygiene

# Auto-label PRs and warn on oversized ones.
on:
  pull_request:
    branches: [ master, staging ]
    types: [ opened, synchronize, reopened ]

permissions:
  contents: read
  pull-requests: write

jobs:
  label:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/labeler@v5
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}

  size:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const pr = context.payload.pull_request;
            const { data: files } = await github.rest.pulls.listFiles({
              owner: context.repo.owner, repo: context.repo.repo, pull_number: pr.number, per_page: 100,
            });
            // Exclude machine-generated lockfiles from the size count
            const humanFiles = files.filter(f => !f.filename.endsWith('package-lock.json') && !f.filename.endsWith('yarn.lock') && !f.filename.endsWith('pnpm-lock.yaml'));
            const changes = humanFiles.reduce((sum, f) => sum + f.additions + f.deletions, 0);
            const limit = 1000;
            if (changes > limit) {
              await github.rest.issues.createComment({
                owner: context.repo.owner, repo: context.repo.repo, issue_number: pr.number,
                body: `⚠️ This PR changes **${changes}** lines (limit: ${limit}). Consider splitting it for easier review.`,
              });
              core.setFailed(`PR too large: ${changes} lines changed`);
            } else {
              core.info(`PR size OK: ${changes} lines`);
            }
