name: Security Scan

# Automated security scanning for issue #215:
# - Gitleaks: secret scanning on PRs
# - Semgrep: SAST for TypeScript / NestJS / Next.js
# - CodeQL: GitHub-native SAST for javascript-typescript
#
# Dependency Review is intentionally NOT duplicated here — it already
# exists in .github/workflows/dependency-review.yml.
# Container scanning is intentionally omitted — the project deploys to
# Vercel serverless; there are no container images to scan.

on:
  pull_request:
    branches: [ master, staging ]
  push:
    branches: [ master, staging ]

permissions:
  contents: read

# Cancel superseded runs on PRs to save minutes
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  gitleaks:
    name: Secret scanning (Gitleaks)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    continue-on-error: false # blocking per #245
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  semgrep:
    name: SAST (Semgrep)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    continue-on-error: false # blocking per #245
    permissions:
      contents: read
    container:
      image: semgrep/semgrep:latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # Required context: this job must ALWAYS run and report, so the
      # docs-only skip happens at step level (#1021). Inline POSIX sh
      # variant of .github/actions/detect-changes (this job runs inside
      # the semgrep container, where the composite action's bash is not
      # guaranteed); same conservative rule — anything not clearly
      # documentation counts as code, an unresolvable base means code.
      - name: Detect code changes
        id: changes
        run: |
          base="${{ github.event.pull_request.base.sha || github.event.before }}"
          if [ -z "$base" ] || ! git cat-file -e "${base}^{commit}" 2>/dev/null; then
            echo "code=true" >> "$GITHUB_OUTPUT"
            echo "Base unavailable — running the scan."
            exit 0
          fi
          if git diff --name-only "$base" HEAD | grep -qvE '\.md$|^docs/|^\.gitignore$|^LICENSE'; then
            echo "code=true" >> "$GITHUB_OUTPUT"
          else
            echo "code=false" >> "$GITHUB_OUTPUT"
            echo "Docs-only change — Semgrep scan skipped (#1021). The required SAST (Semgrep) context still reports success from this job."
          fi
      - name: Run Semgrep
        if: steps.changes.outputs.code == 'true'
        run: |
          semgrep ci \
            --config p/typescript \
            --config p/nestjs \
            --config p/nextjs \
            --config p/security-audit \
            --metrics=off

  codeql:
    name: SAST (CodeQL)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    continue-on-error: false # blocking per #245
    permissions:
      actions: read
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # Required context: this job must ALWAYS run and report, so the
      # docs-only skip happens at step level (#1021) — CodeQL autobuild
      # is the single most expensive job in this workflow.
      - name: Detect change areas
        id: changes
        uses: ./.github/actions/detect-changes
        with:
          base-sha: ${{ github.event.pull_request.base.sha || github.event.before }}
      - name: Note skipped scan
        if: steps.changes.outputs.code != 'true'
        run: echo "Docs-only change — CodeQL scan skipped (#1021). The required SAST (CodeQL) context still reports success from this job."
      - name: Initialize CodeQL
        if: steps.changes.outputs.code == 'true'
        uses: github/codeql-action/init@v4
        with:
          languages: javascript-typescript
      - name: Autobuild
        if: steps.changes.outputs.code == 'true'
        uses: github/codeql-action/autobuild@v4
      - name: Analyze
        if: steps.changes.outputs.code == 'true'
        uses: github/codeql-action/analyze@v4
        with:
          category: "/language:javascript-typescript"
