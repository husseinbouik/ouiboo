name: CI

on:
  push:
    branches: [ main, develop, staging ]
  pull_request:
    branches: [ main, develop, staging ]

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql://test:test@localhost:5433/ouiboo_test?schema=public
      E2E_DATABASE_URL: postgresql://test:test@localhost:5433/ouiboo_test?schema=public
      REDIS_URL: redis://localhost:6379
      JWT_SECRET: ci-jwt-signing-7c1f0b74d195493e8a62bf38
      JWT_REFRESH_SECRET: ci-jwt-refresh-a95e42dc6b704cb18f327d60
      CORS_ORIGINS: https://agency.ci.example.com,https://traveler.ci.example.com,https://admin.ci.example.com
      TRUST_PROXY_HOPS: 1
      SMTP_HOST: smtp.example.com
      SMTP_PORT: 587
      SMTP_USER: mailer@example.com
      SMTP_PASS: ci-mail-auth-7c1f0b74d195493e
      API_URL: https://api.ci.example.com/api/v1
      NEXT_PUBLIC_API_URL: https://api.ci.example.com/api/v1
      TRAVELER_APP_URL: https://traveler.ci.example.com
      AGENCY_APP_URL: https://agency.ci.example.com
      ADMIN_APP_URL: https://admin.ci.example.com
      NEXT_PUBLIC_TRAVELER_URL: https://traveler.ci.example.com
      NEXT_PUBLIC_AGENCY_URL: https://agency.ci.example.com
      NEXT_PUBLIC_LANDING_URL: https://www.ci.example.com
      NEXT_PUBLIC_MEDIA_URL: https://media.ci.example.com
      GMAIL_EMAIL: waitlist@example.com
      GMAIL_APP_PASSWORD: ci-gmail-auth-6f2084ea9314
      GOOGLE_SERVICE_ACCOUNT_EMAIL: sheets-ci@example.com
      GOOGLE_PRIVATE_KEY: ci-google-key-material
      GOOGLE_SHEET_ID: ci-sheet-id
      STORAGE_PROVIDER: s3
      S3_BUCKET: ouiboo-production
      S3_REGION: eu-west-3
      S3_ACCESS_KEY_ID: ci-access-7c1f0b74
      S3_SECRET_ACCESS_KEY: ci-storage-auth-a95e42dc6b70
      S3_ENDPOINT: https://s3.example.com
      S3_PUBLIC_URL: https://media.ci.example.com
      ENABLE_SWAGGER: false

    strategy:
      matrix:
        node-version: [20.x]

    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Validate launch environment contract
        run: npm run check:env:prod

      - name: Reject tracked environment files
        run: npm run check:tracked-env

      - name: Check for launch placeholders
        run: npm run check:placeholders

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Dependency vulnerability audit
        run: npm audit --audit-level=high

      - name: Start test DB for E2E
        run: docker compose -f apps/api/test/docker-compose.test.yml up -d

      - name: Wait for E2E services
        run: |
          for attempt in {1..30}; do
            if docker compose -f apps/api/test/docker-compose.test.yml exec -T db pg_isready -U test -d ouiboo_test \
              && docker compose -f apps/api/test/docker-compose.test.yml exec -T redis redis-cli ping | grep -q PONG; then
              exit 0
            fi
            sleep 2
          done
          docker compose -f apps/api/test/docker-compose.test.yml ps
          exit 1

      - name: Run unit + integration tests
        run: npm run test

      - name: Run API E2E tests
        run: npm run test:e2e:safe --workspace apps/api
        env:
          STORAGE_PROVIDER: local

      - name: Teardown E2E services
        if: always()
        run: docker compose -f apps/api/test/docker-compose.test.yml down --volumes
