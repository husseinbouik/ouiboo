name: CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: https://db.example.com/ouiboo
      JWT_SECRET: replace-with-a-long-jwt-secret
      JWT_REFRESH_SECRET: replace-with-a-long-refresh-secret
      SMTP_HOST: smtp.example.com
      SMTP_PORT: 587
      SMTP_USER: mailer@example.com
      SMTP_PASS: replace-with-smtp-password
      NEXT_PUBLIC_API_URL: https://api.example.com
      STORAGE_PROVIDER: s3
      S3_BUCKET: ouiboo-production
      S3_REGION: eu-west-3
      S3_ACCESS_KEY_ID: example-access-key
      S3_SECRET_ACCESS_KEY: example-secret-key
      S3_ENDPOINT: https://s3.example.com

    strategy:
      matrix:
        node-version: [20.x]

    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Validate launch environment contract
        run: npm run check:env

      - name: Check for launch placeholders
        run: npm run check:placeholders

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build
      - name: Start test DB for E2E
        run: |
          docker-compose -f apps/api/test/docker-compose.test.yml up -d

      - name: Wait for test DB
        run: sleep 10

      - name: Run unit + integration tests
        run: npm run test

      - name: Run API E2E tests
        run: |
          cd apps/api
          npm ci
          npm run test:ci

      - name: Teardown test DB
        if: always()
        run: docker-compose -f apps/api/test/docker-compose.test.yml down
