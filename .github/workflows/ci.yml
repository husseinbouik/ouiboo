name: CI

on:
  push:
    branches: [ master, staging ]
  pull_request:
    branches: [ master, staging ]

permissions:
  contents: read

# Cancel superseded runs on PRs to save minutes. Push runs are NOT
# cancelled: the staging-release gate polls the push check-runs for the
# exact staging SHA, so a cancelled push run would strand a release.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # The dummy CI env lives in .github/env/ci.env (#1021) and is loaded
    # into $GITHUB_ENV by the step below — one copy shared by ci.yml and
    # sonarcloud.yml instead of two drifting inline blocks.

    strategy:
      matrix:
        node-version: [20.x]

    steps:
      - uses: actions/checkout@v4
        with:
          # Full history so detect-changes can diff against the PR base /
          # push "before" SHA.
          fetch-depth: 0

      # This job carries the required `build (20.x)` context, so it must
      # ALWAYS run and report — path filtering happens at step level
      # (#1021): a docs-only change skips the heavy steps below and the
      # job still succeeds, which keeps branch protection and the
      # staging-release gate deadlock-free.
      - name: Detect change areas
        id: changes
        uses: ./.github/actions/detect-changes
        with:
          base-sha: ${{ github.event.pull_request.base.sha || github.event.before }}

      - name: Note skipped heavy steps
        if: steps.changes.outputs.code != 'true'
        run: echo "Docs-only change — lint/build/test steps skipped (#1021). The required build context still reports success from this job."

      - name: Load shared CI env
        if: steps.changes.outputs.code == 'true'
        run: grep -vE '^\s*(#|$)' .github/env/ci.env >> "$GITHUB_ENV"

      - name: Use Node.js ${{ matrix.node-version }}
        if: steps.changes.outputs.code == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Cache Turbo + Next.js build caches
        if: steps.changes.outputs.code == 'true'
        uses: actions/cache@v4
        with:
          path: |
            node_modules/.cache/turbo
            apps/traveler/.next/cache
            apps/agency/.next/cache
            apps/admin/.next/cache
            apps/landing/.next/cache
          key: ${{ runner.os }}-buildcache-${{ hashFiles('package-lock.json') }}-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-buildcache-${{ hashFiles('package-lock.json') }}-
            ${{ runner.os }}-buildcache-

      - name: Install dependencies
        if: steps.changes.outputs.code == 'true'
        run: npm ci

      - name: Validate launch environment contract
        if: steps.changes.outputs.code == 'true'
        run: npm run check:env:prod

      - name: Reject tracked environment files
        if: steps.changes.outputs.code == 'true'
        run: npm run check:tracked-env

      - name: Check for launch placeholders
        if: steps.changes.outputs.code == 'true'
        run: npm run check:placeholders

      - name: Check Phase 1 terminology
        if: steps.changes.outputs.code == 'true'
        run: npm run check:terminology

      - name: Lint
        if: steps.changes.outputs.code == 'true'
        run: npm run lint

      - name: Build
        if: steps.changes.outputs.code == 'true'
        run: npm run build

      # #1027 (F2): enforce the 600 KB home first-load JS budget — the
      # gate boots the production build and measures the JS the home
      # page actually ships. Fails the job when the cap is exceeded.
      - name: Traveller bundle budget (#1027)
        if: steps.changes.outputs.code == 'true'
        working-directory: apps/traveler
        run: node scripts/check-bundle-budget.mjs 600

      - name: Dependency vulnerability audit
        if: steps.changes.outputs.code == 'true'
        # --omit=dev: braces (HIGH) affects all published versions incl. 3.0.3
        # with no patched release; it lives only in the jest dev toolchain
        # (never shipped). All remaining high/critical findings are dev-only.
        run: npm audit --omit=dev --audit-level=high

      - name: Start test DB for E2E
        if: steps.changes.outputs.code == 'true'
        run: docker compose -f apps/api/test/docker-compose.test.yml up -d

      - name: Wait for E2E services
        if: steps.changes.outputs.code == 'true'
        run: |
          for attempt in {1..30}; do
            if docker compose -f apps/api/test/docker-compose.test.yml exec -T db pg_isready -U test -d ouiboo_test \
              && docker compose -f apps/api/test/docker-compose.test.yml exec -T redis redis-cli ping | grep -q PONG; then
              exit 0
            fi
            sleep 2
          done
          docker compose -f apps/api/test/docker-compose.test.yml ps
          exit 1

      - name: Run unit + integration tests
        if: steps.changes.outputs.code == 'true'
        run: npm run test

      - name: Run API E2E tests
        if: steps.changes.outputs.code == 'true'
        run: npm run test:e2e:safe --workspace apps/api
        env:
          STORAGE_PROVIDER: local

      - name: Teardown E2E services
        if: always() && steps.changes.outputs.code == 'true'
        run: docker compose -f apps/api/test/docker-compose.test.yml down --volumes
