name: CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql://test:test@localhost:5433/ouiboo_test?schema=public
      E2E_DATABASE_URL: postgresql://test:test@localhost:5433/ouiboo_test?schema=public
      REDIS_URL: redis://localhost:6379
      JWT_SECRET: replace-with-a-long-jwt-secret
      JWT_REFRESH_SECRET: replace-with-a-long-refresh-secret
      CORS_ORIGINS: http://localhost:3001,http://localhost:3002,http://localhost:3003
      SMTP_HOST: smtp.example.com
      SMTP_PORT: 587
      SMTP_USER: mailer@example.com
      SMTP_PASS: replace-with-smtp-password
      API_URL: http://localhost:3000/api/v1
      NEXT_PUBLIC_API_URL: http://localhost:3000/api/v1
      STORAGE_PROVIDER: s3
      S3_BUCKET: ouiboo-production
      S3_REGION: eu-west-3
      S3_ACCESS_KEY_ID: example-access-key
      S3_SECRET_ACCESS_KEY: example-secret-key
      S3_ENDPOINT: https://s3.example.com
      ENABLE_SWAGGER: false

    strategy:
      matrix:
        node-version: [20.x]

    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Validate launch environment contract
        run: npm run check:env

      - name: Check for launch placeholders
        run: npm run check:placeholders

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Dependency vulnerability audit
        run: npm audit --audit-level=high

      - name: Start test DB for E2E
        run: docker compose -f apps/api/test/docker-compose.test.yml up -d

      - name: Wait for E2E services
        run: |
          for attempt in {1..30}; do
            if docker compose -f apps/api/test/docker-compose.test.yml exec -T db pg_isready -U test -d ouiboo_test \
              && docker compose -f apps/api/test/docker-compose.test.yml exec -T redis redis-cli ping | grep -q PONG; then
              exit 0
            fi
            sleep 2
          done
          docker compose -f apps/api/test/docker-compose.test.yml ps
          exit 1

      - name: Run unit + integration tests
        run: npm run test

      - name: Run API E2E tests
        run: npm run test:e2e:safe --workspace apps/api

      - name: Teardown E2E services
        if: always()
        run: docker compose -f apps/api/test/docker-compose.test.yml down --volumes
