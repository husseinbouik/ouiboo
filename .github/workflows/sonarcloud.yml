name: SonarCloud

on:
  push:
    branches: [staging, master]
  pull_request:
    branches: [staging, master]

jobs:
  sonarcloud:
    name: SonarCloud Scan
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql://test:test@localhost:5433/ouiboo_test?schema=public
      E2E_DATABASE_URL: postgresql://test:test@localhost:5433/ouiboo_test?schema=public
      REDIS_URL: redis://localhost:6379
      JWT_SECRET: ci-sonar-jwt-secret-dummy
      JWT_REFRESH_SECRET: ci-sonar-jwt-refresh-secret-dummy
      CORS_ORIGINS: https://agency.ci.example.com,https://traveler.ci.example.com,https://admin.ci.example.com
      TRUST_PROXY_HOPS: 1
      SMTP_HOST: smtp.example.com
      SMTP_PORT: 587
      SMTP_USER: mailer@example.com
      SMTP_PASS: ci-sonar-mail-dummy
      API_URL: https://api.ci.example.com/api/v1
      NEXT_PUBLIC_API_URL: https://api.ci.example.com/api/v1
      TRAVELER_APP_URL: https://traveler.ci.example.com
      AGENCY_APP_URL: https://agency.ci.example.com
      ADMIN_APP_URL: https://admin.ci.example.com
      NEXT_PUBLIC_TRAVELER_URL: https://traveler.ci.example.com
      NEXT_PUBLIC_AGENCY_URL: https://agency.ci.example.com
      NEXT_PUBLIC_LANDING_URL: https://www.ci.example.com
      NEXT_PUBLIC_MEDIA_URL: https://media.ci.example.com
      GMAIL_EMAIL: waitlist@example.com
      GMAIL_APP_PASSWORD: ci-sonar-gmail-dummy
      GOOGLE_SERVICE_ACCOUNT_EMAIL: sheets-ci@example.com
      GOOGLE_PRIVATE_KEY: ci-sonar-google-key-dummy
      GOOGLE_SHEET_ID: ci-sheet-id
      STORAGE_PROVIDER: s3
      S3_BUCKET: ouiboo-production
      S3_REGION: eu-west-3
      S3_ACCESS_KEY_ID: ci-sonar-access-dummy
      S3_SECRET_ACCESS_KEY: ci-sonar-storage-dummy
      S3_ENDPOINT: https://s3.example.com
      S3_PUBLIC_URL: https://media.ci.example.com
      ENABLE_SWAGGER: false
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Full history for blame info
      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
      - name: Set up Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: 20.x
          cache: 'npm'
      - name: Install dependencies
        run: npm ci
      - name: Start test services for the API suite
        continue-on-error: true
        run: |
          docker compose -f apps/api/test/docker-compose.test.yml up -d
          for attempt in {1..30}; do
            if docker compose -f apps/api/test/docker-compose.test.yml exec -T db pg_isready -U test -d ouiboo_test; then break; fi
            sleep 2
          done
      - name: Coverage — API
        continue-on-error: true
        run: npm run test --workspace=apps/api -- --coverage --coverageReporters=lcov --coverageDirectory=${{ github.workspace }}/apps/api/coverage --coverageThreshold='{}'
      - name: Coverage — traveler
        continue-on-error: true
        run: npm run test --workspace=apps/traveler -- --coverage --coverageReporters=lcov --coverageDirectory=${{ github.workspace }}/apps/traveler/coverage
      - name: Coverage — agency
        continue-on-error: true
        run: npm run test --workspace=apps/agency -- --coverage --coverageReporters=lcov --coverageDirectory=${{ github.workspace }}/apps/agency/coverage
      - name: Coverage — admin
        continue-on-error: true
        run: npm run test --workspace=apps/admin -- --coverage --coverageReporters=lcov --coverageDirectory=${{ github.workspace }}/apps/admin/coverage
      - name: Coverage — landing
        continue-on-error: true
        run: npm run test --workspace=apps/landing -- --coverage --coverageReporters=lcov --coverageDirectory=${{ github.workspace }}/apps/landing/coverage
      - name: Coverage — packages/api-client
        continue-on-error: true
        run: npm run test --workspace=packages/api-client -- --coverage --coverageReporters=lcov --coverageDirectory=${{ github.workspace }}/packages/api-client/coverage
      - name: Coverage — packages/session
        continue-on-error: true
        run: npm run test --workspace=packages/session -- --coverage --coverageReporters=lcov --coverageDirectory=${{ github.workspace }}/packages/session/coverage
      - name: Merge coverage reports
        if: always()
        run: node scripts/merge-lcov.mjs
      - name: SonarCloud Scan
        uses: SonarSource/sonarqube-scan-action@v8.3.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
