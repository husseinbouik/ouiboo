name: SonarCloud

# ADVISORY workflow (#245): SonarCloud reporting is non-blocking and is
# NOT a required branch-protection context. The continue-on-error steps
# below are coverage/report preparation only. Enforced API coverage
# lives in the coverage-floor gate — see docs/ci/coverage.md and
# docs/ci/governance.md.
#
# Trigger design (#1021, finding C3): this workflow used to re-run all
# nine workspace test suites with coverage on EVERY pull request — a
# third execution of suites that ci.yml and api-coverage.yml already
# run, for an advisory report. It now runs on pushes to staging/master
# (trend reporting on what actually landed) and on manual dispatch only.
# The dummy CI env is shared with ci.yml via .github/env/ci.env.

on:
  push:
    branches: [staging, master]
  workflow_dispatch:

# A newer push to the same branch supersedes an in-flight scan; the
# scan is advisory and nothing gates on its check-runs.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  sonarcloud:
    name: SonarCloud Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Full history for blame info
      - name: Load shared CI env
        run: grep -vE '^\s*(#|$)' .github/env/ci.env >> "$GITHUB_ENV"
      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
      - name: Set up Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: 20.x
          cache: 'npm'
      - name: Install dependencies
        run: npm ci
      - name: Start test services for the API suite
        continue-on-error: true
        run: |
          docker compose -f apps/api/test/docker-compose.test.yml up -d
          for attempt in {1..30}; do
            if docker compose -f apps/api/test/docker-compose.test.yml exec -T db pg_isready -U test -d ouiboo_test; then break; fi
            sleep 2
          done
      - name: Coverage — API
        continue-on-error: true
        run: npm run test --workspace=apps/api -- --coverage --coverageReporters=lcov --coverageDirectory=${{ github.workspace }}/apps/api/coverage --coverageThreshold='{}'
      - name: Coverage — traveler
        continue-on-error: true
        run: npm run test --workspace=apps/traveler -- --coverage --coverageReporters=lcov --coverageDirectory=${{ github.workspace }}/apps/traveler/coverage
      - name: Coverage — agency
        continue-on-error: true
        run: npm run test --workspace=apps/agency -- --coverage --coverageReporters=lcov --coverageDirectory=${{ github.workspace }}/apps/agency/coverage
      - name: Coverage — admin
        continue-on-error: true
        run: npm run test --workspace=apps/admin -- --coverage --coverageReporters=lcov --coverageDirectory=${{ github.workspace }}/apps/admin/coverage
      - name: Coverage — landing
        continue-on-error: true
        run: npm run test --workspace=apps/landing -- --coverage --coverageReporters=lcov --coverageDirectory=${{ github.workspace }}/apps/landing/coverage
      - name: Coverage — packages/api-client
        continue-on-error: true
        run: npm run test --workspace=packages/api-client -- --coverage --coverageReporters=lcov --coverageDirectory=${{ github.workspace }}/packages/api-client/coverage
      - name: Coverage — packages/session
        continue-on-error: true
        run: npm run test --workspace=packages/session -- --coverage --coverageReporters=lcov --coverageDirectory=${{ github.workspace }}/packages/session/coverage
      - name: Coverage — packages/utils
        continue-on-error: true
        run: npm run test --workspace=packages/utils -- --coverage --coverageReporters=lcov --coverageDirectory=${{ github.workspace }}/packages/utils/coverage
      - name: Coverage — packages/ui
        continue-on-error: true
        run: npm run test --workspace=packages/ui -- --coverage --coverageReporters=lcov --coverageDirectory=${{ github.workspace }}/packages/ui/coverage
      - name: Merge coverage reports
        if: always()
        run: node scripts/merge-lcov.mjs
      - name: SonarCloud Scan
        uses: SonarSource/sonarqube-scan-action@v8.3.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
