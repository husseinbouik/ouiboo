# Dependabot configuration for Ouiboo
# https://docs.github.com/en/code-security/dependabot
# PRs target staging (not master) to follow the feature -> staging -> master flow.
version: 2
updates:
  # npm dependencies (monorepo root)
  - package-ecosystem: "npm"
    directory: "/"
    target-branch: "staging"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "Africa/Casablanca"
    groups:
      minor-patch:
        patterns:
          - "*"
        exclude-patterns:
          - "*"
        # Only group minor/patch; majors get individual PRs
        update-types:
          - "minor"
          - "patch"
    open-pull-requests-limit: 10
    labels:
      - "dependencies"
      - "automated"

  # GitHub Actions
  - package-ecosystem: "github-actions"
    directory: "/"
    target-branch: "staging"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "Africa/Casablanca"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "ci"
      - "automated"

  # Docker base images
  - package-ecosystem: "docker"
    directory: "/apps/api"
    target-branch: "staging"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "Africa/Casablanca"
    # Ignore Node.js major upgrades — the project standardizes on Node 20.
    # A Node major bump needs deliberate planning, not an automated PR.
    ignore:
      - dependency-name: "node"
        update-types: ["version-update:semver-major"]
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "docker"
      - "automated"
