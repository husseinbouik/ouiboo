# SonarCloud configuration for husseinbouik/ouiboo
# The organization must be filled in after creating the SonarCloud account
# (https://sonarcloud.io) and importing the GitHub repo.

sonar.organization=husseinbouik
sonar.projectKey=husseinbouik_ouiboo
sonar.sources=apps,packages
# *.e2e-spec.ts files end in "-spec.ts", which the *.spec.ts patterns do NOT
# match — without the explicit patterns below they were indexed as sources
# and their lines counted toward unit-coverage gates, even though they are
# integration tests executed against a live DB in CI (never part of the
# unit lcov reports merged for Sonar).
sonar.exclusions=**/node_modules/**,**/*.test.ts,**/*.test.tsx,**/*.spec.ts,**/*.spec.tsx,**/*.e2e-spec.ts,**/*.e2e-spec.tsx,**/dist/**,**/.next/**,**/next.config.ts
sonar.tests=apps,packages
sonar.test.inclusions=**/*.test.ts,**/*.test.tsx,**/*.spec.ts,**/*.spec.tsx,**/*.e2e-spec.ts,**/*.e2e-spec.tsx
sonar.javascript.lcov.reportPaths=coverage/lcov.info
sonar.typescript.lcov.reportPaths=coverage/lcov.info
sonar.sourceEncoding=UTF-8
# Exclude config files from duplication detection (they're intentionally similar across apps)
sonar.cpd.exclusions=**/next.config.ts,**/next.config.js,**/tailwind.config.*,*.config.mjs
