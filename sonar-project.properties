# SonarCloud configuration for husseinbouik/ouiboo
# The organization must be filled in after creating the SonarCloud account
# (https://sonarcloud.io) and importing the GitHub repo.

sonar.organization=husseinbouik
sonar.projectKey=husseinbouik_ouiboo
sonar.sources=apps,packages
sonar.exclusions=**/node_modules/**,**/*.test.ts,**/*.spec.ts,**/dist/**,**/.next/**
sonar.tests=apps,packages
sonar.test.inclusions=**/*.test.ts,**/*.spec.ts
sonar.javascript.lcov.reportPaths=coverage/lcov.info
sonar.sourceEncoding=UTF-8
